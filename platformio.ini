[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@~9.2.2
    bblanchon/ArduinoJson@^7.4.1
    tzapu/WiFiManager@^2.0.17
    blynkkk/Blynk@^1.3.2

build_flags =
    ; TFT_eSPI Settings (CYD ILI9341)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    ; LVGL Settings
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LV_KCONFIG_IGNORE=1
    -D LV_TICK_CUSTOM=1
    -D LV_COLOR_DEPTH=16
    -D CONFIG_LV_USE_LOG=1
    -D CONFIG_LV_USE_TFT_ESPI=1
    -D CONFIG_LV_FONT_MONTSERRAT_12=1
    -D CONFIG_LV_FONT_MONTSERRAT_14=1
    -D CONFIG_LV_FONT_MONTSERRAT_16=1
    -D CONFIG_LV_FONT_MONTSERRAT_20=1
    -D CONFIG_LV_FONT_MONTSERRAT_42=1
