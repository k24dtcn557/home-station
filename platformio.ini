[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/bitbank2/PNGdec.git#1.0.2

build_flags =
    ; TFT_eSPI Settings (Dual-USB CYD)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    ;-D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    ; LVGL Settings
    -D LV_CONF_SKIP=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LV_TICK_CUSTOM=1
    -D LV_COLOR_DEPTH=16
    -D LV_COLOR_16_SWAP=0
    -D LV_FONT_MONTSERRAT_20=1
